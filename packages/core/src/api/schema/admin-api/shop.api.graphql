type Query {
    shop(id: ID!): Shop
    "Returns the shop for the currently authenticated user"
    activeShop: Shop!
    "Get Shop Theme (Builder)"
    theme: Theme!
}

type Mutation {
    "Update an existing Shop"
    updateShop(input: UpdateShopInput!): UpdateShopResult!
    "Update Shop Theme (Builder)"
    createTheme(input: CreateThemeInput!): Theme!
    "Update Shop Theme (Builder)"
    updateTheme(input: UpdateThemeInput!): Theme!
}

input CreateShopInput {
    name: String!
    code: String!
    domain: String
}

input UpdateShopInput {
    id: ID!
    name: String
    code: String
    domain: String
    description: String
    logo: String
    seoTitle: String
    seoDescription: String
}

input CreateThemeInput {
    value: JSON!
}
input UpdateThemeInput {
    id: ID!
    value: JSON!
}

union UpdateShopResult = Shop
